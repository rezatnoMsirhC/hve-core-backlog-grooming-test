name: Backlog Grooming Publisher

on:
  workflow_dispatch:
    inputs:
      final-run-id:
        description: Orchestrator run that uploaded the accepted final aggregate
        required: true
        type: string
      final-artifact-id:
        description: Exact immutable final artifact ID from the reducer summary
        required: true
        type: string
      final-digest:
        description: Expected canonical SHA-256 digest of the final aggregate
        required: true
        type: string
      sweep-id:
        description: Expected immutable sweep ID
        required: true
        type: string
      snapshot-digest:
        description: Expected immutable snapshot digest
        required: true
        type: string
      source-sha:
        description: Expected orchestrator source revision
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.repository_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Revalidate and publish compact trusted sweep state
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Authenticate exact final artifact metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FINAL_RUN_ID: ${{ inputs.final-run-id }}
          FINAL_ARTIFACT_ID: ${{ inputs.final-artifact-id }}
          SWEEP_ID: ${{ inputs.sweep-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        with:
          script: |
            const parsePositiveInteger = (name, value) => {
              const parsed = Number(value);
              if (!Number.isSafeInteger(parsed) || parsed <= 0) throw new Error(`${name} must be a positive safe integer`);
              return parsed;
            };
            if (!/^[a-f0-9]{64}$/.test(process.env.SWEEP_ID) || !/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA)) {
              throw new Error("sweep-id or source-sha has an invalid format");
            }
            const artifactId = parsePositiveInteger("final-artifact-id", process.env.FINAL_ARTIFACT_ID);
            const finalRunId = parsePositiveInteger("final-run-id", process.env.FINAL_RUN_ID);
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: artifactId });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: finalRunId });
            if (artifact.expired || artifact.workflow_run?.id !== finalRunId ||
                artifact.name !== `backlog-grooming-sweep-v1-${process.env.SWEEP_ID}-final-${finalRunId}` ||
                run.path !== ".github/workflows/backlog-groom-orchestrator.yml" ||
                run.head_sha !== process.env.SOURCE_SHA || run.conclusion !== "success") {
              throw new Error("Final artifact metadata is not bound to the accepted successful orchestrator run");
            }
      - name: Download exact final aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.final-artifact-id }}
          path: final-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.final-run-id }}
      - name: Publish compact trusted tracker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FINAL_RUN_ID: ${{ inputs.final-run-id }}
          FINAL_DIGEST: ${{ inputs.final-digest }}
          SWEEP_ID: ${{ inputs.sweep-id }}
          SNAPSHOT_DIGEST: ${{ inputs.snapshot-digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const digest = (value) => crypto.createHash("sha256").update(canonicalize(value)).digest("hex");
            const exactKeys = (value, keys) => value && typeof value === "object" && !Array.isArray(value) &&
              Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            const aggregateKeys = [
              "schema_version", "sweep_id", "snapshot_digest", "source_sha", "completed_at",
              "predecessor_aggregate_digest",
              "total_snapshot_count", "completed_waves", "assessed", "deferred", "prior_cursor",
              "next_cursor", "stop_reason", "planned_sweep_aic",
              "checkpoint_digests", "rows", "aggregate_digest",
            ];
            const aggregate = JSON.parse(fs.readFileSync("final-input/aggregate.json", "utf8"));
            const { aggregate_digest: recordedDigest, ...material } = aggregate;
            if (![process.env.FINAL_DIGEST, process.env.SWEEP_ID, process.env.SNAPSHOT_DIGEST]
              .every((value) => /^[a-f0-9]{64}$/.test(value)) || !/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA)) {
              throw new Error("Publisher digest or source revision input has an invalid format");
            }
            if (!exactKeys(aggregate, aggregateKeys) || digest(material) !== recordedDigest ||
                recordedDigest !== process.env.FINAL_DIGEST ||
                aggregate.schema_version !== "backlog-grooming-sweep-aggregate/v1" ||
                aggregate.sweep_id !== process.env.SWEEP_ID ||
                aggregate.snapshot_digest !== process.env.SNAPSHOT_DIGEST ||
                aggregate.source_sha !== process.env.SOURCE_SHA ||
                (aggregate.predecessor_aggregate_digest !== null &&
                 !/^[a-f0-9]{64}$/.test(aggregate.predecessor_aggregate_digest)) ||
                aggregate.assessed + aggregate.deferred !== aggregate.total_snapshot_count ||
                aggregate.checkpoint_digests.length !== aggregate.completed_waves ||
                aggregate.rows.length !== aggregate.total_snapshot_count) {
              throw new Error("Final sweep aggregate failed trusted publication validation");
            }
            const marker = "<!-- gh-aw:backlog-grooming-tracker -->";
            const state = JSON.stringify({
              schema_version: aggregate.schema_version,
              sweep_id: aggregate.sweep_id,
              completed_at: aggregate.completed_at,
              next_cursor: aggregate.next_cursor,
              aggregate_digest: aggregate.aggregate_digest,
            });
            const report = [
              marker,
              `<!-- gh-aw:backlog-grooming-state ${state} -->`,
              "",
              "# Backlog Grooming Sweep",
              "",
              `Sweep \`${aggregate.sweep_id}\` completed with immutable aggregate \`${aggregate.aggregate_digest}\` in orchestrator run ${process.env.FINAL_RUN_ID}.`,
              "",
              "| Completed | Snapshot issues | Waves | Assessed | Deferred | Prior cursor | Next cursor | Planned AIC | Stop reason |",
              "|---|---|---|---|---|---|---|---|---|",
              `| ${aggregate.completed_at} | ${aggregate.total_snapshot_count} | ${aggregate.completed_waves} | ${aggregate.assessed} | ${aggregate.deferred} | ${aggregate.prior_cursor} | ${aggregate.next_cursor} | ${aggregate.planned_sweep_aic} | ${aggregate.stop_reason} |`,
              "",
              "Detailed per-issue evidence is retained in the final workflow artifact. All findings are advisory for maintainer review.",
            ].join("\n");
            if (report.length > 65000) throw new Error("Compact trusted tracker exceeds 65,000 characters");
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "all", per_page: 100 },
            );
            const trackers = issues.filter((issue) => !issue.pull_request && issue.body?.includes(marker) &&
              issue.user?.login === "github-actions[bot]" && issue.user?.type === "Bot");
            if (trackers.length > 1) throw new Error("Multiple trusted backlog grooming trackers are ambiguous");
            let currentAggregateDigest = null;
            if (trackers.length === 1) {
              const currentStateMatch = trackers[0].body.match(/<!-- gh-aw:backlog-grooming-state (\{.*\}) -->/);
              if (!currentStateMatch) throw new Error("Trusted backlog grooming tracker state is malformed");
              const currentState = JSON.parse(currentStateMatch[1]);
              if (!/^[a-f0-9]{64}$/.test(currentState.aggregate_digest)) {
                throw new Error("Trusted backlog grooming tracker aggregate digest is invalid");
              }
              currentAggregateDigest = currentState.aggregate_digest;
            }
            if (currentAggregateDigest === aggregate.aggregate_digest) {
              core.info("Trusted backlog grooming tracker already contains this aggregate; publication is idempotent");
              await core.summary.addRaw(report).write();
              return;
            }
            if (currentAggregateDigest !== aggregate.predecessor_aggregate_digest) {
              throw new Error("Trusted backlog grooming tracker changed after this sweep snapshot was captured");
            }
            if (trackers.length === 0) {
              await github.rest.issues.create({ ...context.repo, title: "Backlog grooming tracker", body: report });
            } else {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: trackers[0].number,
                body: report,
                state: "open",
              });
            }
            await core.summary.addRaw(report).write();
