name: Backlog Grooming Artifact Conflict Proof

on:
  workflow_dispatch:
    inputs:
      failure-injection:
        description: 'Proof-only immutable artifact conflict to validate'
        required: true
        type: choice
        default: duplicate-artifact
        options:
          - duplicate-artifact
          - conflicting-artifact

concurrency:
  group: backlog-grooming-artifact-conflict-proof-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  inject:
    name: Build and reject an authorized artifact conflict
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out the production validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build proof-only result fixtures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const digest = (value) => crypto.createHash("sha256").update(canonicalize(value)).digest("hex");
            const manifestMaterial = {
              schema_version: "backlog-grooming-wave-manifest/v1",
              sweep_id: "b".repeat(64),
              snapshot_digest: "c".repeat(64),
              wave_number: 1,
              required_waves: 1,
              prior_checkpoint_run_id: null,
              prior_checkpoint_artifact_id: null,
              prior_checkpoint_digest: null,
              ordered_issue_ids: [1],
              planned_aic: 1000,
              run_id: String(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              shards: [{
                shard_id: "shard-01",
                ordered_candidate_ids: [1],
                priority_candidate_ids: [],
                round_robin_candidate_ids: [1],
                total_open_inventory: 1,
                prior_cursor: 0,
                worker_timeout_minutes: 20,
              }],
            };
            const manifest = { ...manifestMaterial, manifest_digest: digest(manifestMaterial) };
            const material = {
              schema_version: "backlog-grooming-shard-result/v1",
              run_id: String(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              shard_id: "shard-01",
              manifest_digest: manifest.manifest_digest,
              ordered_candidate_ids: [1],
              producer: "backlog-groom/result-job",
              started_at: "2026-08-17T00:00:00.000Z",
              completed_at: "2026-08-17T00:01:00.000Z",
              report_data: {
                run: {
                  timestamp: "2026-08-17T00:01:00.000Z",
                  total_open_inventory: 1,
                  assessed: 1,
                  priority_cohort: 0,
                  round_robin_cohort: 1,
                  deferred: 0,
                  stop_reason: "Proof fixture",
                  next_cursor: 1,
                },
                issues: [{
                  issue: 1,
                  title: "Proof issue",
                  selection_reason: "Round-robin",
                  activity_and_ownership_context: "Proof-only fixture",
                  acceptance_signals: "Proof-only fixture",
                  repository_evidence: ["Proof-only fixture"],
                  lineage_evidence: { original_delivery: [], replacement_or_removal: [] },
                  similarity_outcome: "Distinct",
                  disposition: "Still needed",
                  grooming_finding: "Proof-only fixture",
                  recommended_next_step: "No repository mutation",
                  assessment_status: "Assessed",
                }],
              },
            };
            const original = { ...material, result_digest: digest(material) };
            const injected = JSON.parse(JSON.stringify(original));
            if (process.env.FAILURE_INJECTION === "conflicting-artifact") {
              injected.report_data.run.stop_reason = "Authorized conflicting artifact injection";
              const { result_digest: ignored, ...injectedMaterial } = injected;
              injected.result_digest = digest(injectedMaterial);
            }
            fs.mkdirSync("proof-output/manifest", { recursive: true });
            fs.mkdirSync("proof-output/results/original", { recursive: true });
            fs.mkdirSync("proof-output/results/injected", { recursive: true });
            fs.writeFileSync("proof-output/manifest/manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
            fs.writeFileSync("proof-output/results/original/shard-result.json", `${JSON.stringify(original, null, 2)}\n`);
            fs.writeFileSync("proof-output/results/injected/shard-result.json", `${JSON.stringify(injected, null, 2)}\n`);
      - name: Invoke the production wave validator
        id: validate
        continue-on-error: true
        uses: ./.github/actions/backlog-groom-wave-validator
        with:
          manifest-path: proof-output/manifest/manifest.json
          results-directory: proof-output/results
          aggregate-directory: proof-output/aggregate
          expected-run-id: ${{ github.run_id }}
          expected-attempt: ${{ github.run_attempt }}
      - name: Require fail-closed production validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const fs = require("fs");
            if (process.env.VALIDATION_OUTCOME !== "failure" || fs.existsSync("proof-output/aggregate/aggregate.json")) {
              throw new Error("Production validator did not fail closed before aggregate creation");
            }
            core.info(`Production wave validator rejected the authorized ${process.env.FAILURE_INJECTION} fixture`);
      - name: Upload proof-only conflict evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-conflict-proof-${{ github.run_id }}-${{ inputs.failure-injection }}
          path: proof-output
          if-no-files-found: error
          retention-days: 30
