name: Backlog Grooming Orchestrator

on:
  workflow_dispatch:
    inputs:
      candidate-ids:
        description: 'JSON array of positive issue numbers for the non-mutating proof'
        required: true
        type: string
        default: '[]'
      prior-cursor:
        description: 'Cursor value immediately before the planned cohort'
        required: true
        type: number
        default: 0
      shard-count:
        description: 'Requested proof shards (1-4)'
        required: true
        type: number
        default: 1
      shard-width:
        description: 'Maximum candidates assigned to one shard (1-10)'
        required: true
        type: number
        default: 1
      max-parallel:
        description: 'Maximum concurrent proof workers (1-4)'
        required: true
        type: number
        default: 1
      aggregate-ai-credit-cap:
        description: 'Maximum planned AI Credits across 1000-AIC proof workers (1000-4000)'
        required: true
        type: number
        default: 1000
      failure-injection:
        description: 'Failure mode authorized for this proof dispatch'
        required: true
        type: choice
        default: none
        options:
          - none
          - duplicate-artifact
          - conflicting-artifact

concurrency:
  group: backlog-grooming-proof-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Validate proof contract
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      manifest-digest: ${{ steps.manifest.outputs.manifest-digest }}
      shard-matrix: ${{ steps.manifest.outputs.shard-matrix }}
      planned-ai-credits: ${{ steps.manifest.outputs.planned-ai-credits }}
    steps:
      - name: Validate bounds and build manifest
        id: manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_IDS: ${{ inputs.candidate-ids }}
          PRIOR_CURSOR: ${{ inputs.prior-cursor }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          SHARD_WIDTH: ${{ inputs.shard-width }}
          MAX_PARALLEL: ${{ inputs.max-parallel }}
          AGGREGATE_AI_CREDIT_CAP: ${{ inputs.aggregate-ai-credit-cap }}
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");

            const parseInteger = (name, value, minimum, maximum) => {
              const parsed = Number(value);
              if (!Number.isInteger(parsed) || parsed < minimum || parsed > maximum) {
                throw new Error(`${name} must be an integer from ${minimum} through ${maximum}`);
              }
              return parsed;
            };

            const shardCount = parseInteger("shard-count", process.env.SHARD_COUNT, 1, 4);
            const shardWidth = parseInteger("shard-width", process.env.SHARD_WIDTH, 1, 10);
            const maxParallel = parseInteger("max-parallel", process.env.MAX_PARALLEL, 1, 4);
            const perWorkerAiCredits = 1000;
            const aggregateAiCreditCap = parseInteger(
              "aggregate-ai-credit-cap",
              process.env.AGGREGATE_AI_CREDIT_CAP,
              1000,
              4000,
            );
            if (maxParallel > shardCount) {
              throw new Error("max-parallel cannot exceed shard-count");
            }
            const plannedAiCredits = shardCount * perWorkerAiCredits;
            if (plannedAiCredits > aggregateAiCreditCap) {
              throw new Error(
                `planned AI Credits ${plannedAiCredits} exceed cap ${aggregateAiCreditCap}`,
              );
            }

            let candidateIds;
            try {
              candidateIds = JSON.parse(process.env.CANDIDATE_IDS);
            } catch {
              throw new Error("candidate-ids must be valid JSON");
            }
            if (!Array.isArray(candidateIds) || candidateIds.some(
              (issue) => !Number.isInteger(issue) || issue <= 0,
            )) {
              throw new Error("candidate-ids must be a JSON array of positive integers");
            }
            const orderedCandidateIds = [...new Set(candidateIds)].sort((left, right) => left - right);
            if (orderedCandidateIds.length !== candidateIds.length) {
              throw new Error("candidate-ids must not contain duplicates");
            }
            const priorCursor = parseInteger(
              "prior-cursor",
              process.env.PRIOR_CURSOR,
              0,
              Number.MAX_SAFE_INTEGER,
            );
            if (orderedCandidateIds.length > shardCount * shardWidth) {
              throw new Error("candidate-ids exceed the requested shard capacity");
            }

            const shards = Array.from({ length: shardCount }, (_, index) => ({
              shard_id: `shard-${String(index + 1).padStart(2, "0")}`,
              ordered_candidate_ids: [],
            }));
            orderedCandidateIds.forEach((issue, index) => {
              shards[index % shardCount].ordered_candidate_ids.push(issue);
            });
            const matrix = shards
              .filter((shard) => shard.ordered_candidate_ids.length > 0)
              .map((shard) => ({
                ...shard,
                worker_timeout_minutes: 20,
                per_worker_ai_credits: perWorkerAiCredits,
              }));
            const manifest = {
              schema_version: "backlog-grooming-proof-manifest/v1",
              run_id: String(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              producer: "backlog-groom-orchestrator/plan",
              shard_count: shardCount,
              shard_width: shardWidth,
              max_parallel: maxParallel,
              per_worker_ai_credits: perWorkerAiCredits,
              aggregate_ai_credit_cap: aggregateAiCreditCap,
              planned_ai_credits: plannedAiCredits,
              failure_injection: process.env.FAILURE_INJECTION,
              prior_cursor: priorCursor,
              ordered_candidate_ids: orderedCandidateIds,
              shards: matrix,
              result_contract: {
                schema_version: "backlog-grooming-shard-result/v1",
                required_fields: [
                  "schema_version",
                  "run_id",
                  "attempt",
                  "shard_id",
                  "manifest_digest",
                  "ordered_candidate_ids",
                  "result_digest",
                  "producer",
                  "started_at",
                  "completed_at",
                  "report_data",
                ],
                producer: "backlog-groom/result-job",
                terminal_rule: "exactly-one-current-run-result-per-planned-shard",
                reject: [
                  "missing",
                  "malformed",
                  "stale",
                  "unexpected",
                  "duplicate",
                  "conflicting",
                  "manifest-mismatched",
                ],
              },
            };
            const canonicalManifest = JSON.stringify(manifest);
            const manifestDigest = crypto
              .createHash("sha256")
              .update(canonicalManifest)
              .digest("hex");
            const envelope = { ...manifest, manifest_digest: manifestDigest };
            fs.mkdirSync("proof-output", { recursive: true });
            fs.writeFileSync(
              "proof-output/manifest.json",
              `${JSON.stringify(envelope, null, 2)}\n`,
              "utf8",
            );
            core.setOutput("manifest-digest", manifestDigest);
            core.setOutput("shard-matrix", JSON.stringify(matrix));
            core.setOutput("planned-ai-credits", String(plannedAiCredits));
      - name: Upload immutable proof manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: proof-output/manifest.json
          if-no-files-found: error
          retention-days: 7

  assess:
    name: Assess ${{ matrix.shard.shard_id }}
    needs: plan
    if: ${{ needs.plan.outputs.shard-matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard-matrix) }}
    uses: ./.github/workflows/backlog-groom.lock.yml
    with:
      shard_id: ${{ matrix.shard.shard_id }}
      manifest_digest: ${{ needs.plan.outputs.manifest-digest }}
      ordered_candidate_ids: ${{ toJSON(matrix.shard.ordered_candidate_ids) }}
      orchestrator_run_id: ${{ github.run_id }}
      orchestrator_attempt: ${{ fromJSON(github.run_attempt) }}
      worker_timeout_minutes: ${{ matrix.shard.worker_timeout_minutes }}
    permissions:
      actions: write
      contents: read
      issues: read
    secrets: inherit

  inject:
    name: Inject authorized artifact conflict
    needs:
      - plan
      - assess
    if: ${{ inputs.failure-injection != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download shard-01 result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-01
          path: injected-result
      - name: Build injected result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");

            const resultPath = "injected-result/shard-result.json";
            const result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
            if (process.env.FAILURE_INJECTION === "conflicting-artifact") {
              result.report_data.run.stop_reason = "Authorized conflicting artifact injection";
              const material = {
                schema_version: result.schema_version,
                run_id: result.run_id,
                attempt: result.attempt,
                shard_id: result.shard_id,
                manifest_digest: result.manifest_digest,
                ordered_candidate_ids: result.ordered_candidate_ids,
                producer: result.producer,
                started_at: result.started_at,
                completed_at: result.completed_at,
                report_data: result.report_data,
              };
              const canonicalize = (value) => {
                if (Array.isArray(value)) {
                  return `[${value.map(canonicalize).join(",")}]`;
                }
                if (value !== null && typeof value === "object") {
                  return `{${Object.keys(value).sort().map(
                    (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                  ).join(",")}}`;
                }
                return JSON.stringify(value);
              };
              result.result_digest = crypto
                .createHash("sha256")
                .update(canonicalize(material))
                .digest("hex");
              fs.writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`, "utf8");
            }
      - name: Upload injected shard result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-01-injected-${{ inputs.failure-injection }}
          path: injected-result/shard-result.json
          if-no-files-found: error
          retention-days: 7

  validate-results:
    name: Validate complete proof result set
    needs:
      - plan
      - assess
      - inject
    if: ${{ always() && needs.plan.result == 'success' && needs.assess.result == 'success' && (needs.inject.result == 'success' || needs.inject.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download proof manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: proof-manifest
      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: proof-results
      - name: Require one current result per planned shard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");

            const manifest = JSON.parse(fs.readFileSync("proof-manifest/manifest.json", "utf8"));
            const requiredFields = manifest.result_contract.required_fields;
            const expectedShards = new Map(manifest.shards.map(
              (shard) => [shard.shard_id, shard.ordered_candidate_ids],
            ));
            const resultPaths = [];
            const collectResults = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  collectResults(entryPath);
                } else if (entry.name === "shard-result.json") {
                  resultPaths.push(entryPath);
                }
              }
            };
            collectResults("proof-results");

            const canonicalize = (value) => {
              if (Array.isArray(value)) {
                return `[${value.map(canonicalize).join(",")}]`;
              }
              if (value !== null && typeof value === "object") {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const errors = [];
            const resultsByShard = new Map();
            for (const resultPath of resultPaths) {
              let result;
              try {
                result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
              } catch (error) {
                errors.push(`${resultPath}: malformed JSON: ${error.message}`);
                continue;
              }
              const missingFields = requiredFields.filter((field) => !(field in result));
              if (missingFields.length > 0) {
                errors.push(`${resultPath}: missing fields ${missingFields.join(", ")}`);
                continue;
              }
              if (!expectedShards.has(result.shard_id)) {
                errors.push(`${resultPath}: unexpected shard ${result.shard_id}`);
                continue;
              }
              if (result.schema_version !== manifest.result_contract.schema_version) {
                errors.push(`${resultPath}: result schema mismatch`);
              }
              if (result.producer !== manifest.result_contract.producer) {
                errors.push(`${resultPath}: producer mismatch`);
              }
              if (result.run_id !== String(context.runId) || result.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
                errors.push(`${resultPath}: stale run identity`);
              }
              if (result.manifest_digest !== manifest.manifest_digest) {
                errors.push(`${resultPath}: manifest digest mismatch`);
              }
              if (JSON.stringify(result.ordered_candidate_ids) !== JSON.stringify(expectedShards.get(result.shard_id))) {
                errors.push(`${resultPath}: shard candidate mismatch`);
              }
              const material = {
                schema_version: result.schema_version,
                run_id: result.run_id,
                attempt: result.attempt,
                shard_id: result.shard_id,
                manifest_digest: result.manifest_digest,
                ordered_candidate_ids: result.ordered_candidate_ids,
                producer: result.producer,
                started_at: result.started_at,
                completed_at: result.completed_at,
                report_data: result.report_data,
              };
              const computedDigest = crypto
                .createHash("sha256")
                .update(canonicalize(material))
                .digest("hex");
              if (computedDigest !== result.result_digest) {
                errors.push(`${resultPath}: result digest mismatch`);
              }
              const shardResults = resultsByShard.get(result.shard_id) ?? [];
              shardResults.push(result);
              resultsByShard.set(result.shard_id, shardResults);
            }
            for (const shardId of expectedShards.keys()) {
              const shardResults = resultsByShard.get(shardId) ?? [];
              if (shardResults.length !== 1) {
                errors.push(`${shardId}: expected exactly one result, found ${shardResults.length}`);
              }
            }
            if (errors.length > 0) {
              throw new Error(`Proof result validation failed:\n${errors.join("\n")}`);
            }
            core.info(`Accepted ${resultPaths.length} result artifacts for ${expectedShards.size} planned shards`);
