name: Backlog Grooming Orchestrator

on:
  workflow_dispatch:
    inputs:
      candidate-ids:
        description: 'Optional proof override; [] selects the production cohort'
        required: true
        type: string
        default: '[]'
      prior-cursor:
        description: 'Cursor value immediately before the planned cohort'
        required: true
        type: number
        default: 0
      shard-count:
        description: 'Requested proof shards (1-2)'
        required: true
        type: number
        default: 2
      shard-width:
        description: 'Maximum candidates assigned to one shard (1-5)'
        required: true
        type: number
        default: 5
      max-parallel:
        description: 'Maximum concurrent proof workers (1-2)'
        required: true
        type: number
        default: 2
      aggregate-ai-credit-cap:
        description: 'Maximum planned AI Credits across 1000-AIC proof workers (1000-2000)'
        required: true
        type: number
        default: 2000
      failure-injection:
        description: 'Failure mode authorized for this proof dispatch'
        required: true
        type: choice
        default: none
        options:
          - none
          - duplicate-artifact
          - conflicting-artifact
      publish-report:
        description: 'Publish the validated aggregate to the trusted tracker'
        required: true
        type: boolean
        default: false

concurrency:
  group: backlog-grooming-proof-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Validate proof contract
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      manifest-digest: ${{ steps.manifest.outputs.manifest-digest }}
      shard-matrix: ${{ steps.manifest.outputs.shard-matrix }}
      planned-ai-credits: ${{ steps.manifest.outputs.planned-ai-credits }}
    steps:
      - name: Validate bounds and build manifest
        id: manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_IDS: ${{ inputs.candidate-ids }}
          PRIOR_CURSOR: ${{ inputs.prior-cursor }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          SHARD_WIDTH: ${{ inputs.shard-width }}
          MAX_PARALLEL: ${{ inputs.max-parallel }}
          AGGREGATE_AI_CREDIT_CAP: ${{ inputs.aggregate-ai-credit-cap }}
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");

            const parseInteger = (name, value, minimum, maximum) => {
              const parsed = Number(value);
              if (!Number.isInteger(parsed) || parsed < minimum || parsed > maximum) {
                throw new Error(`${name} must be an integer from ${minimum} through ${maximum}`);
              }
              return parsed;
            };

            const shardCount = parseInteger("shard-count", process.env.SHARD_COUNT, 1, 2);
            const shardWidth = parseInteger("shard-width", process.env.SHARD_WIDTH, 1, 5);
            const maxParallel = parseInteger("max-parallel", process.env.MAX_PARALLEL, 1, 2);
            const perWorkerAiCredits = 1000;
            const aggregateAiCreditCap = parseInteger(
              "aggregate-ai-credit-cap",
              process.env.AGGREGATE_AI_CREDIT_CAP,
              1000,
              2000,
            );
            if (maxParallel > shardCount) {
              throw new Error("max-parallel cannot exceed shard-count");
            }
            const plannedAiCredits = shardCount * perWorkerAiCredits;
            if (plannedAiCredits > aggregateAiCreditCap) {
              throw new Error(
                `planned AI Credits ${plannedAiCredits} exceed cap ${aggregateAiCreditCap}`,
              );
            }

            let requestedCandidateIds;
            try {
              requestedCandidateIds = JSON.parse(process.env.CANDIDATE_IDS);
            } catch {
              throw new Error("candidate-ids must be valid JSON");
            }
            if (!Array.isArray(requestedCandidateIds) || requestedCandidateIds.some(
              (issue) => !Number.isInteger(issue) || issue <= 0,
            )) {
              throw new Error("candidate-ids must be a JSON array of positive integers");
            }
            if (new Set(requestedCandidateIds).size !== requestedCandidateIds.length) {
              throw new Error("candidate-ids must not contain duplicates");
            }
            let priorCursor = parseInteger(
              "prior-cursor",
              process.env.PRIOR_CURSOR,
              0,
              Number.MAX_SAFE_INTEGER,
            );
            let orderedCandidateIds = [...requestedCandidateIds].sort((left, right) => left - right);
            let priorityCandidateIds = [];
            let roundRobinCandidateIds = [...orderedCandidateIds];
            let cursorCandidateIds = [...orderedCandidateIds];
            let totalOpenInventory = orderedCandidateIds.length;
            let previousRunTimestamp = "1970-01-01T00:00:00.000Z";
            let selectionMode = "explicit-proof-override";
            if (orderedCandidateIds.length === 0) {
              selectionMode = "production-inventory";
              const marker = "<!-- gh-aw:backlog-grooming-tracker -->";
              const allIssues = await github.paginate(
                github.rest.issues.listForRepo,
                { ...context.repo, state: "all", per_page: 100 },
              );
              const trackers = allIssues.filter(
                (issue) =>
                  !issue.pull_request &&
                  issue.body?.includes(marker) &&
                  issue.user?.login === "github-actions[bot]" &&
                  issue.user?.type === "Bot",
              );
              if (trackers.length > 1) {
                throw new Error(`Expected at most one trusted marker-bearing tracker, found ${trackers.length}`);
              }
              if (trackers.length === 1) {
                const reportRow = trackers[0].body
                  .split(/\r?\n/)
                  .map((line) => line.split("|").slice(1, -1).map((cell) => cell.trim()))
                  .find((cells) => cells.length === 8 && !Number.isNaN(Date.parse(cells[0])));
                if (!reportRow || !/^\d+$/.test(reportRow[7])) {
                  throw new Error("Trusted tracker does not contain a valid run row");
                }
                previousRunTimestamp = new Date(reportRow[0]).toISOString();
                priorCursor = Number(reportRow[7]);
              }
              const trustedTrackerNumber = trackers[0]?.number;
              const openIssues = allIssues
                .filter((issue) =>
                  issue.state === "open" &&
                  !issue.pull_request &&
                  issue.number !== trustedTrackerNumber,
                )
                .sort((left, right) => left.number - right.number);
              totalOpenInventory = openIssues.length;
              const priorityIssues = openIssues.filter(
                (issue) => Date.parse(issue.updated_at) > Date.parse(previousRunTimestamp),
              );
              const roundRobinIssues = [
                ...openIssues.filter((issue) => issue.number > priorCursor),
                ...openIssues.filter((issue) => issue.number <= priorCursor),
              ];
              const selectedIssues = [];
              const selectedNumbers = new Set();
              for (const issue of [...priorityIssues, ...roundRobinIssues]) {
                if (selectedIssues.length >= shardCount * shardWidth) {
                  break;
                }
                if (selectedNumbers.has(issue.number)) {
                  continue;
                }
                selectedNumbers.add(issue.number);
                selectedIssues.push(issue);
              }
              const priorityNumbers = new Set(priorityIssues.map((issue) => issue.number));
              cursorCandidateIds = selectedIssues.map((issue) => issue.number);
              orderedCandidateIds = selectedIssues
                .map((issue) => issue.number)
                .sort((left, right) => left - right);
              priorityCandidateIds = cursorCandidateIds.filter((issue) => priorityNumbers.has(issue));
              roundRobinCandidateIds = cursorCandidateIds.filter((issue) => !priorityNumbers.has(issue));
            }
            if (orderedCandidateIds.length > shardCount * shardWidth) {
              throw new Error("candidate-ids exceed the requested shard capacity");
            }

            const shards = Array.from({ length: shardCount }, (_, index) => ({
              shard_id: `shard-${String(index + 1).padStart(2, "0")}`,
              ordered_candidate_ids: [],
            }));
            orderedCandidateIds.forEach((issue, index) => {
              shards[index % shardCount].ordered_candidate_ids.push(issue);
            });
            const populatedShards = shards.filter((shard) => shard.ordered_candidate_ids.length > 0);
            const plannedShards = populatedShards.length > 0 ? populatedShards : [shards[0]];
            const matrix = plannedShards
              .map((shard) => ({
                ...shard,
                priority_candidate_ids: shard.ordered_candidate_ids.filter(
                  (issue) => priorityCandidateIds.includes(issue),
                ),
                round_robin_candidate_ids: shard.ordered_candidate_ids.filter(
                  (issue) => roundRobinCandidateIds.includes(issue),
                ),
                total_open_inventory: totalOpenInventory,
                prior_cursor: priorCursor,
                worker_timeout_minutes: 20,
                per_worker_ai_credits: perWorkerAiCredits,
              }));
            const manifest = {
              schema_version: "backlog-grooming-proof-manifest/v1",
              run_id: String(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              producer: "backlog-groom-orchestrator/plan",
              shard_count: shardCount,
              shard_width: shardWidth,
              max_parallel: maxParallel,
              per_worker_ai_credits: perWorkerAiCredits,
              aggregate_ai_credit_cap: aggregateAiCreditCap,
              planned_ai_credits: plannedAiCredits,
              failure_injection: process.env.FAILURE_INJECTION,
              selection_mode: selectionMode,
              previous_run_timestamp: previousRunTimestamp,
              total_open_inventory: totalOpenInventory,
              prior_cursor: priorCursor,
              ordered_candidate_ids: orderedCandidateIds,
              cursor_candidate_ids: cursorCandidateIds,
              priority_candidate_ids: priorityCandidateIds,
              round_robin_candidate_ids: roundRobinCandidateIds,
              shards: matrix,
              result_contract: {
                schema_version: "backlog-grooming-shard-result/v1",
                required_fields: [
                  "schema_version",
                  "run_id",
                  "attempt",
                  "shard_id",
                  "manifest_digest",
                  "ordered_candidate_ids",
                  "result_digest",
                  "producer",
                  "started_at",
                  "completed_at",
                  "report_data",
                ],
                producer: "backlog-groom/result-job",
                terminal_rule: "exactly-one-current-run-result-per-planned-shard",
                reject: [
                  "missing",
                  "malformed",
                  "stale",
                  "unexpected",
                  "duplicate",
                  "conflicting",
                  "manifest-mismatched",
                ],
              },
            };
            const canonicalManifest = JSON.stringify(manifest);
            const manifestDigest = crypto
              .createHash("sha256")
              .update(canonicalManifest)
              .digest("hex");
            const envelope = { ...manifest, manifest_digest: manifestDigest };
            fs.mkdirSync("proof-output", { recursive: true });
            fs.writeFileSync(
              "proof-output/manifest.json",
              `${JSON.stringify(envelope, null, 2)}\n`,
              "utf8",
            );
            core.setOutput("manifest-digest", manifestDigest);
            core.setOutput("shard-matrix", JSON.stringify(matrix));
            core.setOutput("planned-ai-credits", String(plannedAiCredits));
      - name: Upload immutable proof manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: proof-output/manifest.json
          if-no-files-found: error
          retention-days: 7

  assess:
    name: Assess ${{ matrix.shard.shard_id }}
    needs: plan
    if: ${{ needs.plan.outputs.shard-matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard-matrix) }}
    uses: ./.github/workflows/backlog-groom.lock.yml
    with:
      shard_id: ${{ matrix.shard.shard_id }}
      manifest_digest: ${{ needs.plan.outputs.manifest-digest }}
      ordered_candidate_ids: ${{ toJSON(matrix.shard.ordered_candidate_ids) }}
      priority_candidate_ids: ${{ toJSON(matrix.shard.priority_candidate_ids) }}
      round_robin_candidate_ids: ${{ toJSON(matrix.shard.round_robin_candidate_ids) }}
      total_open_inventory: ${{ matrix.shard.total_open_inventory }}
      prior_cursor: ${{ matrix.shard.prior_cursor }}
      orchestrator_run_id: ${{ github.run_id }}
      orchestrator_attempt: ${{ fromJSON(github.run_attempt) }}
      worker_timeout_minutes: ${{ matrix.shard.worker_timeout_minutes }}
    permissions:
      actions: write
      contents: read
      issues: read
    secrets: inherit

  inject:
    name: Inject authorized artifact conflict
    needs:
      - plan
      - assess
    if: ${{ inputs.failure-injection != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download shard-01 result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-01
          path: injected-result
      - name: Build injected result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILURE_INJECTION: ${{ inputs.failure-injection }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");

            const resultPath = "injected-result/shard-result.json";
            const result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
            if (process.env.FAILURE_INJECTION === "conflicting-artifact") {
              result.report_data.run.stop_reason = "Authorized conflicting artifact injection";
              const material = {
                schema_version: result.schema_version,
                run_id: result.run_id,
                attempt: result.attempt,
                shard_id: result.shard_id,
                manifest_digest: result.manifest_digest,
                ordered_candidate_ids: result.ordered_candidate_ids,
                producer: result.producer,
                started_at: result.started_at,
                completed_at: result.completed_at,
                report_data: result.report_data,
              };
              const canonicalize = (value) => {
                if (Array.isArray(value)) {
                  return `[${value.map(canonicalize).join(",")}]`;
                }
                if (value !== null && typeof value === "object") {
                  return `{${Object.keys(value).sort().map(
                    (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                  ).join(",")}}`;
                }
                return JSON.stringify(value);
              };
              result.result_digest = crypto
                .createHash("sha256")
                .update(canonicalize(material))
                .digest("hex");
              fs.writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`, "utf8");
            }
      - name: Upload injected shard result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-01-injected-${{ inputs.failure-injection }}
          path: injected-result/shard-result.json
          if-no-files-found: error
          retention-days: 7

  validate-results:
    name: Validate complete proof result set
    needs:
      - plan
      - assess
      - inject
    if: ${{ always() && needs.plan.result == 'success' && needs.assess.result == 'success' && (needs.inject.result == 'success' || needs.inject.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download proof manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: proof-manifest
      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: proof-results
      - name: Require one current result per planned shard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");

            const manifest = JSON.parse(fs.readFileSync("proof-manifest/manifest.json", "utf8"));
            const { manifest_digest: recordedManifestDigest, ...manifestMaterial } = manifest;
            const requiredFields = manifest.result_contract.required_fields;
            const expectedShards = new Map(manifest.shards.map(
              (shard) => [shard.shard_id, shard.ordered_candidate_ids],
            ));
            const resultPaths = [];
            const collectResults = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  collectResults(entryPath);
                } else if (entry.name === "shard-result.json") {
                  resultPaths.push(entryPath);
                }
              }
            };
            collectResults("proof-results");

            const canonicalize = (value) => {
              if (Array.isArray(value)) {
                return `[${value.map(canonicalize).join(",")}]`;
              }
              if (value !== null && typeof value === "object") {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const errors = [];
            const resultsByShard = new Map();
            const computedManifestDigest = crypto
              .createHash("sha256")
              .update(JSON.stringify(manifestMaterial))
              .digest("hex");
            if (computedManifestDigest !== recordedManifestDigest) {
              errors.push("manifest digest mismatch");
            }
            for (const resultPath of resultPaths) {
              let result;
              try {
                result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
              } catch (error) {
                errors.push(`${resultPath}: malformed JSON: ${error.message}`);
                continue;
              }
              const missingFields = requiredFields.filter((field) => !(field in result));
              if (missingFields.length > 0) {
                errors.push(`${resultPath}: missing fields ${missingFields.join(", ")}`);
                continue;
              }
              if (!expectedShards.has(result.shard_id)) {
                errors.push(`${resultPath}: unexpected shard ${result.shard_id}`);
                continue;
              }
              if (result.schema_version !== manifest.result_contract.schema_version) {
                errors.push(`${resultPath}: result schema mismatch`);
              }
              if (result.producer !== manifest.result_contract.producer) {
                errors.push(`${resultPath}: producer mismatch`);
              }
              if (result.run_id !== String(context.runId) || result.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
                errors.push(`${resultPath}: stale run identity`);
              }
              if (result.manifest_digest !== manifest.manifest_digest) {
                errors.push(`${resultPath}: manifest digest mismatch`);
              }
              if (JSON.stringify(result.ordered_candidate_ids) !== JSON.stringify(expectedShards.get(result.shard_id))) {
                errors.push(`${resultPath}: shard candidate mismatch`);
              }
              const material = {
                schema_version: result.schema_version,
                run_id: result.run_id,
                attempt: result.attempt,
                shard_id: result.shard_id,
                manifest_digest: result.manifest_digest,
                ordered_candidate_ids: result.ordered_candidate_ids,
                producer: result.producer,
                started_at: result.started_at,
                completed_at: result.completed_at,
                report_data: result.report_data,
              };
              const computedDigest = crypto
                .createHash("sha256")
                .update(canonicalize(material))
                .digest("hex");
              if (computedDigest !== result.result_digest) {
                errors.push(`${resultPath}: result digest mismatch`);
              }
              const reportRows = result.report_data?.issues;
              const reportRun = result.report_data?.run;
              if (!Array.isArray(reportRows) || !reportRun || typeof reportRun !== "object") {
                errors.push(`${resultPath}: report data is malformed`);
              } else {
                const reportIssueIds = reportRows.map((row) => row.issue).sort((left, right) => left - right);
                if (JSON.stringify(reportIssueIds) !== JSON.stringify(expectedShards.get(result.shard_id))) {
                  errors.push(`${resultPath}: report issue IDs do not match shard candidates`);
                }
                const assessed = reportRows.filter((row) => row.assessment_status === "Assessed").length;
                const deferred = reportRows.filter((row) => row.assessment_status === "Deferred").length;
                if (assessed !== reportRun.assessed || deferred !== reportRun.deferred) {
                  errors.push(`${resultPath}: report counts do not match row statuses`);
                }
              }
              const shardResults = resultsByShard.get(result.shard_id) ?? [];
              shardResults.push(result);
              resultsByShard.set(result.shard_id, shardResults);
            }
            for (const shardId of expectedShards.keys()) {
              const shardResults = resultsByShard.get(shardId) ?? [];
              if (shardResults.length !== 1) {
                errors.push(`${shardId}: expected exactly one result, found ${shardResults.length}`);
              }
            }
            if (errors.length > 0) {
              throw new Error(`Proof result validation failed:\n${errors.join("\n")}`);
            }

            const rowsByIssue = new Map();
            const acceptedResults = manifest.shards.map((shard) => resultsByShard.get(shard.shard_id)[0]);
            for (const result of acceptedResults) {
              for (const row of result.report_data.issues) {
                if (rowsByIssue.has(row.issue)) {
                  throw new Error(`Proof result validation failed:\nduplicate aggregate issue ${row.issue}`);
                }
                rowsByIssue.set(row.issue, row);
              }
            }
            const aggregateRows = manifest.ordered_candidate_ids.map((issue) => rowsByIssue.get(issue));
            if (aggregateRows.some((row) => !row)) {
              throw new Error("Proof result validation failed:\naggregate issue coverage is incomplete");
            }
            const inventoryCounts = new Set(acceptedResults.map(
              (result) => result.report_data.run.total_open_inventory,
            ));
            if (inventoryCounts.size !== 1) {
              throw new Error("Proof result validation failed:\nshard inventory counts disagree");
            }
            const assessedRows = aggregateRows.filter((row) => row.assessment_status === "Assessed");
            const deferredRows = aggregateRows.filter((row) => row.assessment_status === "Deferred");
            const assessedCursorRows = manifest.cursor_candidate_ids
              .map((issue) => rowsByIssue.get(issue))
              .filter((row) => row.assessment_status === "Assessed");
            const priorityCohort = acceptedResults.reduce(
              (total, result) => total + result.report_data.run.priority_cohort,
              0,
            );
            const roundRobinCohort = acceptedResults.reduce(
              (total, result) => total + result.report_data.run.round_robin_cohort,
              0,
            );
            if (priorityCohort + roundRobinCohort !== aggregateRows.length) {
              throw new Error("Proof result validation failed:\naggregate cohort counts are inconsistent");
            }
            const aggregateMaterial = {
              schema_version: "backlog-grooming-aggregate/v1",
              run_id: String(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              manifest_digest: manifest.manifest_digest,
              prior_cursor: manifest.prior_cursor,
              cursor_candidate_ids: manifest.cursor_candidate_ids,
              result_digests: acceptedResults.map((result) => result.result_digest),
              run: {
                timestamp: acceptedResults.map((result) => result.completed_at).sort().at(-1),
                total_open_inventory: [...inventoryCounts][0],
                assessed: assessedRows.length,
                priority_cohort: priorityCohort,
                round_robin_cohort: roundRobinCohort,
                deferred: deferredRows.length,
                stop_reason: deferredRows.length === 0
                  ? "All planned candidates assessed"
                  : `${deferredRows.length} planned candidates deferred`,
                next_cursor: assessedCursorRows.length > 0
                  ? assessedCursorRows.at(-1).issue
                  : manifest.prior_cursor,
              },
              issues: aggregateRows,
            };
            const aggregateDigest = crypto
              .createHash("sha256")
              .update(canonicalize(aggregateMaterial))
              .digest("hex");
            fs.mkdirSync("aggregate-output", { recursive: true });
            fs.writeFileSync(
              "aggregate-output/aggregate.json",
              `${JSON.stringify({ ...aggregateMaterial, aggregate_digest: aggregateDigest }, null, 2)}\n`,
              "utf8",
            );
            core.info(`Accepted ${resultPaths.length} result artifacts for ${expectedShards.size} planned shards`);
      - name: Upload deterministic proof aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: aggregate-output/aggregate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated backlog grooming report
    needs: validate-results
    if: ${{ needs.validate-results.result == 'success' && inputs.publish-report }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download deterministic aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backlog-grooming-proof-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: aggregate-input
      - name: Revalidate aggregate and publish trusted tracker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const marker = "<!-- gh-aw:backlog-grooming-tracker -->";
            const aggregate = JSON.parse(fs.readFileSync("aggregate-input/aggregate.json", "utf8"));
            const exactKeys = (value, keys) =>
              value &&
              typeof value === "object" &&
              !Array.isArray(value) &&
              Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            const validText = (value, max = 2000) =>
              typeof value === "string" && value.trim().length > 0 && value.length <= max;
            const validCount = (value) => Number.isInteger(value) && value >= 0;
            const canonicalize = (value) => {
              if (Array.isArray(value)) {
                return `[${value.map(canonicalize).join(",")}]`;
              }
              if (value !== null && typeof value === "object") {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const escapeCell = (value) =>
              String(value)
                .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, "")
                .replace(/\\/g, "\\\\")
                .replace(/\|/g, "\\|")
                .replace(/\r?\n/g, "<br>")
                .replace(/@(?=[a-z\d](?:[a-z\d-]{0,38})(?![\w-]))/gi, "@\u200b");

            const aggregateKeys = [
              "schema_version", "run_id", "attempt", "manifest_digest", "prior_cursor",
              "cursor_candidate_ids", "result_digests", "run", "issues", "aggregate_digest",
            ];
            const runKeys = [
              "timestamp", "total_open_inventory", "assessed", "priority_cohort",
              "round_robin_cohort", "deferred", "stop_reason", "next_cursor",
            ];
            const rowKeys = [
              "issue", "title", "selection_reason", "activity_and_ownership_context",
              "acceptance_signals", "repository_evidence", "lineage_evidence",
              "similarity_outcome", "disposition", "grooming_finding",
              "recommended_next_step", "assessment_status",
            ];
            const lineageKeys = ["original_delivery", "replacement_or_removal"];
            const similarities = new Set(["Match", "Similar", "Distinct", "Uncertain"]);
            const dispositions = new Set([
              "Still needed", "Likely completed", "Superseded", "Possible duplicate",
              "Needs correction", "Uncertain",
            ]);
            const statuses = new Set(["Assessed", "Deferred"]);
            if (!exactKeys(aggregate, aggregateKeys) ||
                aggregate.schema_version !== "backlog-grooming-aggregate/v1" ||
                aggregate.run_id !== String(context.runId) ||
                aggregate.attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                !/^[a-f0-9]{64}$/.test(aggregate.manifest_digest) ||
                !validCount(aggregate.prior_cursor) ||
                !Array.isArray(aggregate.cursor_candidate_ids) ||
                !Array.isArray(aggregate.result_digests) || aggregate.result_digests.length === 0 ||
                !aggregate.result_digests.every((digest) => /^[a-f0-9]{64}$/.test(digest)) ||
                !exactKeys(aggregate.run, runKeys) || !Array.isArray(aggregate.issues)) {
              core.setFailed("Aggregate does not match the trusted publication schema");
              return;
            }
            const { aggregate_digest: recordedDigest, ...aggregateMaterial } = aggregate;
            const computedDigest = crypto
              .createHash("sha256")
              .update(canonicalize(aggregateMaterial))
              .digest("hex");
            if (computedDigest !== recordedDigest) {
              core.setFailed("Aggregate digest mismatch");
              return;
            }
            const run = aggregate.run;
            if (!validText(run.timestamp, 40) || Number.isNaN(Date.parse(run.timestamp)) ||
                !validText(run.stop_reason, 500) ||
                ![
                  run.total_open_inventory, run.assessed, run.priority_cohort,
                  run.round_robin_cohort, run.deferred, run.next_cursor,
                ].every(validCount) ||
                run.assessed + run.deferred !== aggregate.issues.length ||
                run.priority_cohort + run.round_robin_cohort !== aggregate.issues.length) {
              core.setFailed("Aggregate run counts, timestamp, or stop reason are invalid");
              return;
            }
            const issueNumbers = new Set();
            for (const row of aggregate.issues) {
              if (!exactKeys(row, rowKeys) || !Number.isInteger(row.issue) || row.issue <= 0 ||
                  issueNumbers.has(row.issue) || !validText(row.title, 500) ||
                  !validText(row.selection_reason, 200) ||
                  !validText(row.activity_and_ownership_context) ||
                  !validText(row.acceptance_signals) ||
                  !Array.isArray(row.repository_evidence) || row.repository_evidence.length === 0 ||
                  !row.repository_evidence.every((item) => validText(item, 500)) ||
                  !exactKeys(row.lineage_evidence, lineageKeys) ||
                  !Array.isArray(row.lineage_evidence.original_delivery) ||
                  !Array.isArray(row.lineage_evidence.replacement_or_removal) ||
                  !row.lineage_evidence.original_delivery.every((item) => validText(item, 500)) ||
                  !row.lineage_evidence.replacement_or_removal.every((item) => validText(item, 500)) ||
                  !similarities.has(row.similarity_outcome) || !dispositions.has(row.disposition) ||
                  !validText(row.grooming_finding) || !validText(row.recommended_next_step) ||
                  !statuses.has(row.assessment_status)) {
                core.setFailed("Aggregate issue data does not match the canonical row schema");
                return;
              }
              if (row.disposition === "Possible duplicate" &&
                  !["Match", "Similar"].includes(row.similarity_outcome)) {
                core.setFailed("Possible duplicate requires a Match or Similar outcome");
                return;
              }
              if (row.disposition === "Superseded") {
                const original = row.lineage_evidence.original_delivery;
                const replacement = row.lineage_evidence.replacement_or_removal;
                if (original.length === 0 || replacement.length === 0 ||
                    !replacement.some((item) => !original.includes(item))) {
                  core.setFailed("Superseded requires distinct lineage evidence");
                  return;
                }
              }
              issueNumbers.add(row.issue);
            }
            const assessedRows = aggregate.issues.filter(
              (row) => row.assessment_status === "Assessed",
            );
            const deferredRows = aggregate.issues.filter(
              (row) => row.assessment_status === "Deferred",
            );
            const cursorIssueIds = new Set(aggregate.cursor_candidate_ids);
            if (cursorIssueIds.size !== issueNumbers.size ||
                [...cursorIssueIds].some((issue) => !issueNumbers.has(issue))) {
              core.setFailed("Aggregate cursor order does not match the issue inventory");
              return;
            }
            const rowsByIssue = new Map(aggregate.issues.map((row) => [row.issue, row]));
            const assessedCursorRows = aggregate.cursor_candidate_ids
              .map((issue) => rowsByIssue.get(issue))
              .filter((row) => row.assessment_status === "Assessed");
            const expectedCursor = assessedCursorRows.length > 0
              ? assessedCursorRows.at(-1).issue
              : aggregate.prior_cursor;
            if (assessedRows.length !== run.assessed || deferredRows.length !== run.deferred ||
                run.next_cursor !== expectedCursor) {
              core.setFailed("Aggregate row statuses or cursor do not match the run summary");
              return;
            }

            const reportLines = [
              "# Backlog Grooming Report",
              "",
              "| Run timestamp | Total open inventory | Assessed | Priority cohort | Round-robin cohort | Deferred | Stop reason | Next cursor |",
              "|---|---|---|---|---|---|---|---|",
              `| ${escapeCell(run.timestamp)} | ${run.total_open_inventory} | ${run.assessed} | ${run.priority_cohort} | ${run.round_robin_cohort} | ${run.deferred} | ${escapeCell(run.stop_reason)} | ${run.next_cursor} |`,
              "",
              "| Issue | Title | Selection reason | Activity and ownership context | Acceptance signals | Repository evidence | Similarity outcome | Disposition | Grooming finding | Recommended next step | Assessment status |",
              "|---|---|---|---|---|---|---|---|---|---|---|",
            ];
            if (aggregate.issues.length === 0) {
              reportLines.push("| - | No issues assessed | - | - | - | - | - | - | No maintainer action | None | Assessed |");
            } else {
              for (const row of aggregate.issues) {
                const evidence = [
                  ...row.repository_evidence,
                  ...row.lineage_evidence.original_delivery.map((item) => `Original delivery: ${item}`),
                  ...row.lineage_evidence.replacement_or_removal.map(
                    (item) => `Replacement or removal: ${item}`,
                  ),
                ];
                reportLines.push(`| #${row.issue} | ${escapeCell(row.title)} | ${escapeCell(row.selection_reason)} | ${escapeCell(row.activity_and_ownership_context)} | ${escapeCell(row.acceptance_signals)} | ${evidence.map(escapeCell).join("<br>")} | ${row.similarity_outcome} | ${row.disposition} | ${escapeCell(row.grooming_finding)} | ${escapeCell(row.recommended_next_step)} | ${row.assessment_status} |`);
              }
            }
            const report = reportLines.join("\n");
            if (report.length > 65000) {
              core.setFailed(`Rendered report length ${report.length} exceeds the allowed range`);
              return;
            }

            const matches = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "all", per_page: 100 },
            );
            const trackers = matches.filter(
              (issue) =>
                !issue.pull_request &&
                issue.body?.includes(marker) &&
                issue.user?.login === "github-actions[bot]" &&
                issue.user?.type === "Bot",
            );
            if (trackers.length > 1) {
              core.setFailed(`Expected at most one trusted marker-bearing tracker, found ${trackers.length}`);
              return;
            }

            const body = `${marker}\n\n${report}`;
            if (trackers.length === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title: "Backlog grooming tracker",
                body,
              });
            } else {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: trackers[0].number,
                body,
                state: "open",
              });
            }
            await core.summary.addRaw(report).write();
