name: Backlog Grooming Multi-Wave Proof

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Proof-only hosted multi-run scenario'
        required: true
        type: choice
        default: complete-three-wave
        options:
          - complete-three-wave
          - duplicate-dispatch
          - failed-wave-resume
      protocol-version:
        description: 'Internal proof continuation protocol; leave the default for initiation'
        required: true
        type: string
        default: backlog-grooming-multi-wave-proof/v1
      continuation-mode:
        description: 'Internal proof continuation mode; leave initial for initiation'
        required: true
        type: choice
        default: initial
        options:
          - initial
          - ordinary
          - injection
          - recovery
      proof-id:
        description: 'Internal immutable proof identity; leave empty for initiation'
        required: false
        type: string
        default: ''
      wave-number:
        description: 'Internal bounded proof wave number; leave at one for initiation'
        required: true
        type: number
        default: 1
      snapshot-run-id:
        description: 'Internal snapshot producing run identity'
        required: false
        type: string
        default: ''
      snapshot-artifact-id:
        description: 'Internal snapshot artifact identity'
        required: false
        type: string
        default: ''
      snapshot-digest:
        description: 'Internal snapshot content digest'
        required: false
        type: string
        default: ''
      checkpoint-run-id:
        description: 'Internal predecessor checkpoint producing run identity'
        required: false
        type: string
        default: ''
      checkpoint-artifact-id:
        description: 'Internal predecessor checkpoint artifact identity'
        required: false
        type: string
        default: ''
      checkpoint-digest:
        description: 'Internal predecessor checkpoint content digest'
        required: false
        type: string
        default: ''

concurrency:
  group: backlog-grooming-multi-wave-proof-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  wave:
    name: Build and validate one zero-model proof wave
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      proof-id: ${{ steps.prepare.outputs.proof-id }}
      wave-number: ${{ steps.prepare.outputs.wave-number }}
      source-ref-name: ${{ steps.prepare.outputs.source-ref-name }}
      snapshot-run-id: ${{ steps.prepare.outputs.snapshot-run-id }}
      snapshot-artifact-id: ${{ steps.snapshot.outputs.artifact-id || steps.prepare.outputs.snapshot-artifact-id }}
      snapshot-digest: ${{ steps.prepare.outputs.snapshot-digest }}
      prior-checkpoint-run-id: ${{ steps.prepare.outputs.prior-checkpoint-run-id }}
      prior-checkpoint-artifact-id: ${{ steps.prepare.outputs.prior-checkpoint-artifact-id }}
      prior-checkpoint-digest: ${{ steps.prepare.outputs.prior-checkpoint-digest }}
      checkpoint-run-id: ${{ steps.checkpoint-upload.outputs.artifact-id && github.run_id || '' }}
      checkpoint-artifact-id: ${{ steps.checkpoint-upload.outputs.artifact-id }}
      checkpoint-digest: ${{ steps.accept.outputs.checkpoint-digest }}
      dispatch-kind: ${{ steps.accept.outputs.dispatch-kind || steps.gate.outputs.dispatch-kind || 'none' }}
      sweep-complete: ${{ steps.accept.outputs.sweep-complete || 'false' }}
      final-digest: ${{ steps.finalize.outputs.final-digest }}
    steps:
      - name: Check out the proof and shared validator implementations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate continuation and build deterministic fixtures
        id: prepare
        uses: ./.github/actions/backlog-groom-multi-wave-proof
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: prepare
          scenario: ${{ inputs.scenario }}
          protocol-version: ${{ inputs.protocol-version }}
          continuation-mode: ${{ inputs.continuation-mode }}
          proof-id: ${{ inputs.proof-id }}
          wave-number: ${{ inputs.wave-number }}
          snapshot-run-id: ${{ inputs.snapshot-run-id }}
          snapshot-artifact-id: ${{ inputs.snapshot-artifact-id }}
          snapshot-digest: ${{ inputs.snapshot-digest }}
          checkpoint-run-id: ${{ inputs.checkpoint-run-id }}
          checkpoint-artifact-id: ${{ inputs.checkpoint-artifact-id }}
          checkpoint-digest: ${{ inputs.checkpoint-digest }}
      - name: Upload immutable synthetic snapshot
        id: snapshot
        if: ${{ steps.prepare.outputs.wave-number == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-snapshot-${{ github.run_id }}
          path: proof-work/snapshot/snapshot.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload duplicate execution no-op evidence
        id: duplicate-noop
        if: ${{ steps.prepare.outputs.mode == 'duplicate-noop' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-duplicate-noop-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/duplicate-noop/duplicate-noop.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable proof wave manifest
        id: manifest
        if: ${{ steps.prepare.outputs.mode != 'duplicate-noop' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-manifest-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/manifest/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload generated shard-result fixtures
        id: fixtures
        if: ${{ steps.prepare.outputs.mode != 'duplicate-noop' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-fixtures-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/results
          if-no-files-found: error
          retention-days: 30
      - name: Invoke the production wave validator
        id: validate
        if: ${{ steps.prepare.outputs.mode != 'duplicate-noop' }}
        continue-on-error: true
        uses: ./.github/actions/backlog-groom-wave-validator
        with:
          manifest-path: proof-work/manifest/manifest.json
          results-directory: proof-work/results
          aggregate-directory: proof-work/aggregate
          expected-run-id: ${{ github.run_id }}
          expected-attempt: ${{ github.run_attempt }}
      - name: Require the scenario-specific validator outcome
        id: gate
        if: ${{ steps.prepare.outputs.mode != 'duplicate-noop' }}
        uses: ./.github/actions/backlog-groom-multi-wave-proof
        with:
          command: check-validation
          scenario: ${{ inputs.scenario }}
          proof-id: ${{ steps.prepare.outputs.proof-id }}
          wave-number: ${{ steps.prepare.outputs.wave-number }}
          mode: ${{ steps.prepare.outputs.mode }}
          validation-outcome: ${{ steps.validate.outcome }}
          manifest-artifact-id: ${{ steps.manifest.outputs.artifact-id }}
          manifest-digest: ${{ steps.prepare.outputs.manifest-digest }}
          fixture-artifact-id: ${{ steps.fixtures.outputs.artifact-id }}
          fixture-digest: ${{ steps.prepare.outputs.fixture-digest }}
          prior-checkpoint-digest: ${{ steps.prepare.outputs.prior-checkpoint-digest }}
      - name: Upload rejected wave evidence
        id: rejection
        if: ${{ steps.prepare.outputs.mode == 'injection' && steps.gate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-rejection-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/rejection/rejection.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable validated aggregate
        id: aggregate
        if: ${{ steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-aggregate-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/aggregate/aggregate.json
          if-no-files-found: error
          retention-days: 30
      - name: Build accepted proof checkpoint
        id: accept
        if: ${{ steps.validate.outcome == 'success' }}
        uses: ./.github/actions/backlog-groom-multi-wave-proof
        with:
          command: checkpoint
          aggregate-artifact-id: ${{ steps.aggregate.outputs.artifact-id }}
          aggregate-digest: ${{ steps.validate.outputs.aggregate-digest }}
          manifest-artifact-id: ${{ steps.manifest.outputs.artifact-id }}
          fixture-artifact-id: ${{ steps.fixtures.outputs.artifact-id }}
          fixture-digest: ${{ steps.prepare.outputs.fixture-digest }}
          prior-checkpoint-artifact-id: ${{ steps.prepare.outputs.prior-checkpoint-artifact-id }}
          prior-checkpoint-digest: ${{ steps.prepare.outputs.prior-checkpoint-digest }}
      - name: Upload accepted proof checkpoint
        id: checkpoint-upload
        if: ${{ steps.accept.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-checkpoint-${{ steps.prepare.outputs.wave-number }}-${{ github.run_id }}
          path: proof-work/checkpoint/checkpoint.json
          if-no-files-found: error
          retention-days: 30
      - name: Reduce and authenticate terminal proof evidence
        id: finalize
        if: ${{ steps.accept.outputs.sweep-complete == 'true' }}
        uses: ./.github/actions/backlog-groom-multi-wave-proof
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: finalize
          proof-id: ${{ steps.prepare.outputs.proof-id }}
          snapshot-run-id: ${{ steps.prepare.outputs.snapshot-run-id }}
      - name: Upload terminal proof evidence
        id: terminal-evidence
        if: ${{ steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-terminal-evidence-${{ github.run_id }}
          path: proof-work/terminal-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Authenticate terminal evidence artifact ID and producer
        if: ${{ steps.terminal-evidence.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TERMINAL_ARTIFACT_ID: ${{ steps.terminal-evidence.outputs.artifact-id }}
          TERMINAL_ARTIFACT_DIGEST: ${{ steps.terminal-evidence.outputs.artifact-digest }}
          TERMINAL_ARTIFACT_NAME: backlog-groom-multi-wave-proof-${{ steps.prepare.outputs.proof-id }}-terminal-evidence-${{ github.run_id }}
          FINAL_DIGEST: ${{ steps.finalize.outputs.final-digest }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const evidence = JSON.parse(
              fs.readFileSync("proof-work/terminal-evidence/terminal-proof-evidence.json", "utf8"),
            );
            const { final_digest: recordedDigest, ...material } = evidence;
            const computedDigest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            const artifactId = Number(process.env.TERMINAL_ARTIFACT_ID);
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: artifactId });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            if (artifact.expired || artifact.name !== process.env.TERMINAL_ARTIFACT_NAME ||
                artifact.workflow_run?.id !== context.runId || run.path !== ".github/workflows/backlog-groom-multi-wave-proof.yml" ||
                run.head_sha !== process.env.GITHUB_SHA || !/^sha256:[a-f0-9]{64}$/.test(process.env.TERMINAL_ARTIFACT_DIGEST) ||
                recordedDigest !== process.env.FINAL_DIGEST || computedDigest !== recordedDigest) {
              throw new Error("Terminal proof evidence artifact failed ID, producer, or digest authentication");
            }

  dispatch:
    name: Dispatch one bounded proof continuation
    needs: wave
    if: ${{ needs.wave.outputs.dispatch-kind == 'ordinary' || needs.wave.outputs.dispatch-kind == 'recovery' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch proof recovery
        if: ${{ needs.wave.outputs.dispatch-kind == 'recovery' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROOF_ID: ${{ needs.wave.outputs.proof-id }}
          SNAPSHOT_RUN_ID: ${{ needs.wave.outputs.snapshot-run-id }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.wave.outputs.snapshot-artifact-id }}
          SNAPSHOT_DIGEST: ${{ needs.wave.outputs.snapshot-digest }}
          PRIOR_CHECKPOINT_RUN_ID: ${{ needs.wave.outputs.prior-checkpoint-run-id }}
          PRIOR_CHECKPOINT_ARTIFACT_ID: ${{ needs.wave.outputs.prior-checkpoint-artifact-id }}
          PRIOR_CHECKPOINT_DIGEST: ${{ needs.wave.outputs.prior-checkpoint-digest }}
          SOURCE_REF_NAME: ${{ needs.wave.outputs.source-ref-name }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const request = {
              kind: "recovery",
              wave_number: Number("${{ needs.wave.outputs.wave-number }}"),
              continuation_mode: "recovery",
              predecessor_checkpoint_digest: process.env.PRIOR_CHECKPOINT_DIGEST,
            };
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "backlog-groom-multi-wave-proof.yml",
              ref: process.env.SOURCE_REF_NAME,
              inputs: {
                "scenario": "${{ inputs.scenario }}",
                "protocol-version": "backlog-grooming-multi-wave-proof/v1",
                "continuation-mode": "recovery",
                "proof-id": process.env.PROOF_ID,
                "wave-number": String(request.wave_number),
                "snapshot-run-id": process.env.SNAPSHOT_RUN_ID,
                "snapshot-artifact-id": process.env.SNAPSHOT_ARTIFACT_ID,
                "snapshot-digest": process.env.SNAPSHOT_DIGEST,
                "checkpoint-run-id": process.env.PRIOR_CHECKPOINT_RUN_ID,
                "checkpoint-artifact-id": process.env.PRIOR_CHECKPOINT_ARTIFACT_ID,
                "checkpoint-digest": process.env.PRIOR_CHECKPOINT_DIGEST,
              },
            });
            const material = {
              schema_version: "backlog-grooming-multi-wave-proof-dispatch/v1",
              proof_id: process.env.PROOF_ID,
              scenario: "${{ inputs.scenario }}",
              source_run_id: String(context.runId),
              source_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              source_sha: process.env.GITHUB_SHA,
              source_wave_number: request.wave_number,
              requests: [request],
              created_at: new Date().toISOString(),
            };
            material.dispatch_digest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            fs.mkdirSync("proof-dispatch", { recursive: true });
            fs.writeFileSync("proof-dispatch/dispatch-record.json", `${JSON.stringify(material, null, 2)}\n`);
      - name: Dispatch duplicate identity then exact successor
        if: ${{ needs.wave.outputs.dispatch-kind == 'ordinary' && inputs.scenario == 'duplicate-dispatch' && needs.wave.outputs.wave-number == '2' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROOF_ID: ${{ needs.wave.outputs.proof-id }}
          SNAPSHOT_RUN_ID: ${{ needs.wave.outputs.snapshot-run-id }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.wave.outputs.snapshot-artifact-id }}
          SNAPSHOT_DIGEST: ${{ needs.wave.outputs.snapshot-digest }}
          PRIOR_CHECKPOINT_RUN_ID: ${{ needs.wave.outputs.prior-checkpoint-run-id }}
          PRIOR_CHECKPOINT_ARTIFACT_ID: ${{ needs.wave.outputs.prior-checkpoint-artifact-id }}
          PRIOR_CHECKPOINT_DIGEST: ${{ needs.wave.outputs.prior-checkpoint-digest }}
          CHECKPOINT_RUN_ID: ${{ needs.wave.outputs.checkpoint-run-id }}
          CHECKPOINT_ARTIFACT_ID: ${{ needs.wave.outputs.checkpoint-artifact-id }}
          CHECKPOINT_DIGEST: ${{ needs.wave.outputs.checkpoint-digest }}
          SOURCE_REF_NAME: ${{ needs.wave.outputs.source-ref-name }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const dispatch = async (waveNumber, mode, checkpoint) => github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "backlog-groom-multi-wave-proof.yml",
              ref: process.env.SOURCE_REF_NAME,
              inputs: {
                "scenario": "duplicate-dispatch",
                "protocol-version": "backlog-grooming-multi-wave-proof/v1",
                "continuation-mode": mode,
                "proof-id": process.env.PROOF_ID,
                "wave-number": String(waveNumber),
                "snapshot-run-id": process.env.SNAPSHOT_RUN_ID,
                "snapshot-artifact-id": process.env.SNAPSHOT_ARTIFACT_ID,
                "snapshot-digest": process.env.SNAPSHOT_DIGEST,
                "checkpoint-run-id": checkpoint.runId,
                "checkpoint-artifact-id": checkpoint.artifactId,
                "checkpoint-digest": checkpoint.digest,
              },
            });
            const predecessor = {
              runId: process.env.PRIOR_CHECKPOINT_RUN_ID,
              artifactId: process.env.PRIOR_CHECKPOINT_ARTIFACT_ID,
              digest: process.env.PRIOR_CHECKPOINT_DIGEST,
            };
            await dispatch(2, "ordinary", predecessor);
            const noopPrefix = `backlog-groom-multi-wave-proof-${process.env.PROOF_ID}-duplicate-noop-2-`;
            let noop = null;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const { data } = await github.rest.actions.listArtifactsForRepo({ ...context.repo, per_page: 100, page: 1 });
              noop = data.artifacts.find((artifact) => !artifact.expired && artifact.name.startsWith(noopPrefix));
              if (noop) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (!noop) throw new Error("Duplicate proof run did not emit a bounded no-op artifact before successor dispatch");
            const { data: noopRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: noop.workflow_run.id,
            });
            if (noopRun.path !== ".github/workflows/backlog-groom-multi-wave-proof.yml" ||
                noopRun.head_sha !== process.env.GITHUB_SHA) {
              throw new Error("Duplicate no-op artifact producer authentication failed");
            }
            const accepted = {
              runId: process.env.CHECKPOINT_RUN_ID,
              artifactId: process.env.CHECKPOINT_ARTIFACT_ID,
              digest: process.env.CHECKPOINT_DIGEST,
            };
            await dispatch(3, "ordinary", accepted);
            const requests = [
              {
                kind: "duplicate",
                wave_number: 2,
                continuation_mode: "ordinary",
                predecessor_checkpoint_digest: predecessor.digest,
                observed_noop_artifact_id: String(noop.id),
                observed_noop_run_id: String(noop.workflow_run.id),
              },
              {
                kind: "ordinary",
                wave_number: 3,
                continuation_mode: "ordinary",
                predecessor_checkpoint_digest: accepted.digest,
              },
            ];
            const material = {
              schema_version: "backlog-grooming-multi-wave-proof-dispatch/v1",
              proof_id: process.env.PROOF_ID,
              scenario: "duplicate-dispatch",
              source_run_id: String(context.runId),
              source_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              source_sha: process.env.GITHUB_SHA,
              source_wave_number: 2,
              requests,
              created_at: new Date().toISOString(),
            };
            material.dispatch_digest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            fs.mkdirSync("proof-dispatch", { recursive: true });
            fs.writeFileSync("proof-dispatch/dispatch-record.json", `${JSON.stringify(material, null, 2)}\n`);
      - name: Dispatch exact ordinary successor
        if: ${{ needs.wave.outputs.dispatch-kind == 'ordinary' && !(inputs.scenario == 'duplicate-dispatch' && needs.wave.outputs.wave-number == '2') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROOF_ID: ${{ needs.wave.outputs.proof-id }}
          SNAPSHOT_RUN_ID: ${{ needs.wave.outputs.snapshot-run-id }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.wave.outputs.snapshot-artifact-id }}
          SNAPSHOT_DIGEST: ${{ needs.wave.outputs.snapshot-digest }}
          CHECKPOINT_RUN_ID: ${{ needs.wave.outputs.checkpoint-run-id }}
          CHECKPOINT_ARTIFACT_ID: ${{ needs.wave.outputs.checkpoint-artifact-id }}
          CHECKPOINT_DIGEST: ${{ needs.wave.outputs.checkpoint-digest }}
          SOURCE_REF_NAME: ${{ needs.wave.outputs.source-ref-name }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const nextWave = Number("${{ needs.wave.outputs.wave-number }}") + 1;
            const nextMode = "${{ inputs.scenario }}" === "failed-wave-resume" && nextWave === 2
              ? "injection"
              : "ordinary";
            const request = {
              kind: "ordinary",
              wave_number: nextWave,
              continuation_mode: nextMode,
              predecessor_checkpoint_digest: process.env.CHECKPOINT_DIGEST,
            };
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "backlog-groom-multi-wave-proof.yml",
              ref: process.env.SOURCE_REF_NAME,
              inputs: {
                "scenario": "${{ inputs.scenario }}",
                "protocol-version": "backlog-grooming-multi-wave-proof/v1",
                "continuation-mode": nextMode,
                "proof-id": process.env.PROOF_ID,
                "wave-number": String(nextWave),
                "snapshot-run-id": process.env.SNAPSHOT_RUN_ID,
                "snapshot-artifact-id": process.env.SNAPSHOT_ARTIFACT_ID,
                "snapshot-digest": process.env.SNAPSHOT_DIGEST,
                "checkpoint-run-id": process.env.CHECKPOINT_RUN_ID,
                "checkpoint-artifact-id": process.env.CHECKPOINT_ARTIFACT_ID,
                "checkpoint-digest": process.env.CHECKPOINT_DIGEST,
              },
            });
            const material = {
              schema_version: "backlog-grooming-multi-wave-proof-dispatch/v1",
              proof_id: process.env.PROOF_ID,
              scenario: "${{ inputs.scenario }}",
              source_run_id: String(context.runId),
              source_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              source_sha: process.env.GITHUB_SHA,
              source_wave_number: Number("${{ needs.wave.outputs.wave-number }}"),
              requests: [request],
              created_at: new Date().toISOString(),
            };
            material.dispatch_digest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            fs.mkdirSync("proof-dispatch", { recursive: true });
            fs.writeFileSync("proof-dispatch/dispatch-record.json", `${JSON.stringify(material, null, 2)}\n`);
      - name: Upload authenticated dispatch ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backlog-groom-multi-wave-proof-${{ needs.wave.outputs.proof-id }}-dispatch-${{ needs.wave.outputs.wave-number }}-${{ github.run_id }}
          path: proof-dispatch/dispatch-record.json
          if-no-files-found: error
          retention-days: 30