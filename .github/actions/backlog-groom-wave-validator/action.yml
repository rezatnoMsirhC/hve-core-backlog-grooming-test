name: Validate backlog grooming wave
description: Validate one immutable backlog grooming manifest and its exact shard result set

inputs:
  manifest-path:
    description: Path to the immutable wave manifest
    required: true
  results-directory:
    description: Directory containing shard-result.json envelopes
    required: true
  aggregate-directory:
    description: Directory where aggregate.json is written
    required: true
  expected-run-id:
    description: Producing orchestrator run ID
    required: true
  expected-attempt:
    description: Producing orchestrator attempt
    required: true

outputs:
  aggregate-digest:
    description: Canonical aggregate SHA-256 digest
    value: ${{ steps.validate.outputs.aggregate-digest }}
  assessed-ids:
    description: JSON array of assessed issue IDs
    value: ${{ steps.validate.outputs.assessed-ids }}
  deferred-ids:
    description: JSON array of deferred issue IDs
    value: ${{ steps.validate.outputs.deferred-ids }}

runs:
  using: composite
  steps:
    - name: Validate exact wave result set
      id: validate
      shell: bash
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        INPUT_AGGREGATE_DIRECTORY: ${{ inputs.aggregate-directory }}
        INPUT_EXPECTED_RUN_ID: ${{ inputs.expected-run-id }}
        INPUT_EXPECTED_ATTEMPT: ${{ inputs.expected-attempt }}
      run: node "$GITHUB_ACTION_PATH/validate.js"