name: Backlog grooming multi-wave proof helper
description: Build and authenticate zero-model fixtures, checkpoints, and terminal proof evidence

inputs:
  command:
    description: Helper operation to execute
    required: true
  scenario:
    description: Selected proof scenario
    required: false
    default: ''
  protocol-version:
    description: Bounded proof continuation protocol
    required: false
    default: ''
  continuation-mode:
    description: Initial, ordinary, injection, or recovery execution mode
    required: false
    default: ''
  proof-id:
    description: Immutable proof identity
    required: false
    default: ''
  wave-number:
    description: Bounded proof wave number
    required: false
    default: '1'
  snapshot-run-id:
    description: Snapshot producing run ID
    required: false
    default: ''
  snapshot-artifact-id:
    description: Snapshot artifact ID
    required: false
    default: ''
  snapshot-digest:
    description: Snapshot content digest
    required: false
    default: ''
  checkpoint-run-id:
    description: Predecessor checkpoint producing run ID
    required: false
    default: ''
  checkpoint-artifact-id:
    description: Predecessor checkpoint artifact ID
    required: false
    default: ''
  checkpoint-digest:
    description: Predecessor checkpoint content digest
    required: false
    default: ''
  mode:
    description: Prepared execution mode
    required: false
    default: ''
  validation-outcome:
    description: Shared validator step outcome
    required: false
    default: ''
  manifest-artifact-id:
    description: Current manifest artifact ID
    required: false
    default: ''
  manifest-digest:
    description: Current manifest content digest
    required: false
    default: ''
  fixture-artifact-id:
    description: Current fixture artifact ID
    required: false
    default: ''
  fixture-digest:
    description: Current fixture bundle digest
    required: false
    default: ''
  aggregate-artifact-id:
    description: Current aggregate artifact ID
    required: false
    default: ''
  aggregate-digest:
    description: Current aggregate content digest
    required: false
    default: ''
  prior-checkpoint-artifact-id:
    description: Accepted predecessor artifact ID
    required: false
    default: ''
  prior-checkpoint-digest:
    description: Accepted predecessor content digest
    required: false
    default: ''

outputs:
  mode:
    description: Prepared wave, injection, or duplicate no-op mode
    value: ${{ steps.proof.outputs.mode }}
  proof-id:
    description: Immutable proof identity
    value: ${{ steps.proof.outputs.proof-id }}
  wave-number:
    description: Current bounded wave number
    value: ${{ steps.proof.outputs.wave-number }}
  snapshot-run-id:
    description: Snapshot producing run ID
    value: ${{ steps.proof.outputs.snapshot-run-id }}
  snapshot-artifact-id:
    description: Existing snapshot artifact ID for continuations
    value: ${{ steps.proof.outputs.snapshot-artifact-id }}
  snapshot-digest:
    description: Immutable snapshot digest
    value: ${{ steps.proof.outputs.snapshot-digest }}
  manifest-digest:
    description: Current manifest digest
    value: ${{ steps.proof.outputs.manifest-digest }}
  fixture-digest:
    description: Current fixture bundle digest
    value: ${{ steps.proof.outputs.fixture-digest }}
  prior-checkpoint-run-id:
    description: Accepted predecessor run ID
    value: ${{ steps.proof.outputs.prior-checkpoint-run-id }}
  prior-checkpoint-artifact-id:
    description: Accepted predecessor artifact ID
    value: ${{ steps.proof.outputs.prior-checkpoint-artifact-id }}
  prior-checkpoint-digest:
    description: Accepted predecessor digest
    value: ${{ steps.proof.outputs.prior-checkpoint-digest }}
  source-ref-name:
    description: Immutable snapshot source ref name
    value: ${{ steps.proof.outputs.source-ref-name }}
  dispatch-kind:
    description: Ordinary, recovery, or no dispatch
    value: ${{ steps.proof.outputs.dispatch-kind }}
  checkpoint-digest:
    description: Accepted checkpoint digest
    value: ${{ steps.proof.outputs.checkpoint-digest }}
  sweep-complete:
    description: Whether the third checkpoint completed the proof
    value: ${{ steps.proof.outputs.sweep-complete }}
  final-digest:
    description: Terminal proof evidence digest
    value: ${{ steps.proof.outputs.final-digest }}
  duplicate-noop-artifact-id:
    description: Authenticated duplicate no-op artifact ID
    value: ${{ steps.proof.outputs.duplicate-noop-artifact-id }}
  duplicate-noop-artifact-digest:
    description: Authenticated duplicate no-op artifact digest
    value: ${{ steps.proof.outputs.duplicate-noop-artifact-digest }}
  duplicate-noop-run-id:
    description: Authenticated duplicate no-op producer run ID
    value: ${{ steps.proof.outputs.duplicate-noop-run-id }}
  duplicate-noop-digest:
    description: Authenticated duplicate no-op content digest
    value: ${{ steps.proof.outputs.duplicate-noop-digest }}

runs:
  using: composite
  steps:
    - name: Execute proof helper
      id: proof
      shell: bash
      env:
        PROOF_COMMAND: ${{ inputs.command }}
        PROOF_SCENARIO: ${{ inputs.scenario }}
        PROOF_PROTOCOL_VERSION: ${{ inputs.protocol-version }}
        PROOF_CONTINUATION_MODE: ${{ inputs.continuation-mode }}
        PROOF_ID: ${{ inputs.proof-id }}
        PROOF_WAVE_NUMBER: ${{ inputs.wave-number }}
        PROOF_SNAPSHOT_RUN_ID: ${{ inputs.snapshot-run-id }}
        PROOF_SNAPSHOT_ARTIFACT_ID: ${{ inputs.snapshot-artifact-id }}
        PROOF_SNAPSHOT_DIGEST: ${{ inputs.snapshot-digest }}
        PROOF_CHECKPOINT_RUN_ID: ${{ inputs.checkpoint-run-id }}
        PROOF_CHECKPOINT_ARTIFACT_ID: ${{ inputs.checkpoint-artifact-id }}
        PROOF_CHECKPOINT_DIGEST: ${{ inputs.checkpoint-digest }}
        PROOF_MODE: ${{ inputs.mode }}
        PROOF_VALIDATION_OUTCOME: ${{ inputs.validation-outcome }}
        PROOF_MANIFEST_ARTIFACT_ID: ${{ inputs.manifest-artifact-id }}
        PROOF_MANIFEST_DIGEST: ${{ inputs.manifest-digest }}
        PROOF_FIXTURE_ARTIFACT_ID: ${{ inputs.fixture-artifact-id }}
        PROOF_FIXTURE_DIGEST: ${{ inputs.fixture-digest }}
        PROOF_AGGREGATE_ARTIFACT_ID: ${{ inputs.aggregate-artifact-id }}
        PROOF_AGGREGATE_DIGEST: ${{ inputs.aggregate-digest }}
        PROOF_PRIOR_CHECKPOINT_ARTIFACT_ID: ${{ inputs.prior-checkpoint-artifact-id }}
        PROOF_PRIOR_CHECKPOINT_DIGEST: ${{ inputs.prior-checkpoint-digest }}
      run: node "$GITHUB_ACTION_PATH/proof.js"
